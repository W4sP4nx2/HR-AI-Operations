title = "HR AI Command Center gitleaks config"

# Inherit gitleaks' full default ruleset — WITHOUT this, the config below would
# replace all rules, leaving only the allowlist and detecting nothing (a scan
# that's green even on a real leaked key). With it, defaults catch real secrets
# and the allowlist suppresses only the documented fake test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Allow only documented fake/placeholder API key examples in history."
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)(\.pytest_cache|\.ruff_cache|__pycache__)/''',
]
regexes = [
  '''sk-ant-\.\.\.''',
  '''sk-ant-FAKE[-A-Za-z0-9_]*''',
  '''sk-ant-fake-key[-A-Za-z0-9_]*''',
  '''sk-server-key-[0-9]+''',
  '''sk-visitor[-A-Za-z0-9_]*''',
  # Test fixtures (no real secrets): a fake BYOK key + the JWT secret used by the
  # test client. Matched on the exact placeholder pattern so real keys still trip.
  '''fixture-anthropic-key[-A-Za-z0-9_]*''',
  '''test-secret-key-that-is-long-enough[-A-Za-z0-9_]*''',
]
