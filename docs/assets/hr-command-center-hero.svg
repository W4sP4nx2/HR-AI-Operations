<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HR AI Command Center governance dashboard hero</title>
  <desc id="desc">Dark enterprise AI dashboard showing AMD local inference, Fireworks cloud routing, cost controls, bias radar and audit ledger.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2B1034"/>
      <stop offset="52%" stop-color="#16081C"/>
      <stop offset="100%" stop-color="#08040B"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="amd" x1="0" x2="1">
      <stop stop-color="#FF3A4E"/>
      <stop offset="1" stop-color="#B5122A"/>
    </linearGradient>
    <linearGradient id="fireworks" x1="0" x2="1">
      <stop stop-color="#31C7FF"/>
      <stop offset="1" stop-color="#1D67FF"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity="0.75">
    <rect x="86" y="78" width="1428" height="744" rx="34" fill="#0D0712" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="112" y="106" width="286" height="688" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="430" y="106" width="724" height="688" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="1186" y="106" width="302" height="688" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <text x="142" y="158" fill="#FFF1D3" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">HR AI Command Center</text>
  <text x="142" y="190" fill="#FFB090" fill-opacity="0.86" font-family="Inter, Arial, sans-serif" font-size="15">Governed agentic HR operations</text>

  <g transform="translate(142 238)">
    <rect width="216" height="48" rx="14" fill="#CA5995"/>
    <text x="22" y="31" fill="white" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Hybrid Routing</text>
    <rect y="68" width="216" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="22" y="99" fill="#FFF1D3" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="16">Bias Audit</text>
    <rect y="136" width="216" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="22" y="167" fill="#FFF1D3" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="16">Cost Controls</text>
