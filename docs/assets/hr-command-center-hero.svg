    <circle cx="859" cy="500" r="8" fill="#FF3A4E"/>
    <circle cx="872" cy="369" r="8" fill="#31C7FF"/>
    <circle cx="737" cy="477" r="5" fill="#FFF1D3"/>
    <circle cx="927" cy="532" r="5" fill="#FFF1D3"/>
