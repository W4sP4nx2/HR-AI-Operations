    <text x="18" y="23" fill="#D7FFE6" font-family="Inter, Arial, sans-serif" font-size="12">Cost arbitrage</text>
    <text x="18" y="42" fill="#D7FFE6" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">73.9% savings target</text>
    <rect x="232" width="210" height="54" rx="14" fill="#31C7FF" fill-opacity="0.14" stroke="#31C7FF" stroke-opacity="0.38"/>
    <text x="250" y="23" fill="#D7F4FF" font-family="Inter, Arial, sans-serif" font-size="12">Batch vision</text>
    <text x="250" y="42" fill="#D7F4FF" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">1,000 synthetic resumes</text>
    <rect x="464" width="210" height="54" rx="14" fill="#FF405F" fill-opacity="0.14" stroke="#FF405F" stroke-opacity="0.38"/>
    <text x="482" y="23" fill="#FFD8DF" font-family="Inter, Arial, sans-serif" font-size="12">Guardrail trap</text>
    <text x="482" y="42" fill="#FFD8DF" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Poisoned policies</text>
