    <text x="0" y="30" fill="#FFF1D3" fill-opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="13">Four-Fifths rule boundary</text>
    <circle cx="132" cy="180" r="104" fill="#3CE886" fill-opacity="0.08" stroke="#3CE886" stroke-opacity="0.78" stroke-width="3"/>
    <circle cx="132" cy="180" r="72" fill="none" stroke="#3CE886" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="132" y1="76" x2="132" y2="284" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <line x1="28" y1="180" x2="236" y2="180" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="104" cy="124" r="9" fill="#3CE886" filter="url(#softGlow)"/>
    <text x="48" y="112" fill="#D7FFE6" font-family="Inter, Arial, sans-serif" font-size="12">Gender .95</text>
    <circle cx="178" cy="224" r="9" fill="#3CE886" filter="url(#softGlow)"/>
    <text x="190" y="244" fill="#D7FFE6" font-family="Inter, Arial, sans-serif" font-size="12">Age .86</text>
    <path d="M132 180L268 126" stroke="#FF405F" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="268" cy="126" r="13" fill="#FF405F" filter="url(#softGlow)"/>
    <text x="174" y="100" fill="#FFD8DF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Race .71 alert</text>
  </g>

  <g transform="translate(1218 510)">
