    <circle cx="785" cy="455" r="20" fill="#FFF1D3"/>
    <circle cx="602" cy="588" r="54" fill="#23C76A" fill-opacity="0.25" stroke="#38D66B" stroke-width="3"/>
    <circle cx="985" cy="582" r="62" fill="url(#amd)" fill-opacity="0.28" stroke="#FF3A4E" stroke-width="3"/>
    <circle cx="916" cy="292" r="58" fill="url(#fireworks)" fill-opacity="0.25" stroke="#31C7FF" stroke-width="3"/>
