  <text x="924" y="666" fill="#FFD2D8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">AMD MI300X</text>
  <text x="862" y="216" fill="#D7F4FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Fireworks Cloud</text>
  <text x="726" y="536" fill="#FFF1D3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Orchestrator</text>

