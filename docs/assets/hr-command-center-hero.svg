  <path d="M785 455C718 470 663 523 602 588" stroke="#38D66B" stroke-width="5" stroke-linecap="round" stroke-opacity="0.65"/>
  <path d="M785 455C858 468 930 520 985 582" stroke="#FF3A4E" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M785 455C842 418 887 354 916 292" stroke="#31C7FF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>

  <g>
