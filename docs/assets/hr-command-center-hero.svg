    <rect y="30" width="230" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect y="86" width="230" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect y="142" width="230" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="16" y="56" fill="#FFF1D3" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="12">policy_query · cited 2024</text>
    <text x="16" y="112" fill="#FFF1D3" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="12">pii_redacted · [SSN]</text>
    <text x="16" y="168" fill="#FFF1D3" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="12">bias_alert · ratio 0.71</text>
