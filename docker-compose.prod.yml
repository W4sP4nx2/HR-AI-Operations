# Production stack: Postgres + Qdrant + multi-stage backend/frontend images.
# Usage:
#   export FIREWORKS_API_KEY=...          # optional; omit for deterministic mode
#   export JWT_SECRET="$(openssl rand -hex 32)"
#   docker compose -f docker-compose.prod.yml up --build -d
services:
  db:
    # pgvector image = Postgres 16 with the `vector` extension preinstalled,
    # so RAG runs inside the same datastore (no separate Qdrant service).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_dev_password}
      POSTGRES_DB: hrdb
    ports:
      # Published for local validation (e.g. the pgvector round-trip test).
      # In a real prod deploy, drop this or bind to 127.0.0.1 only.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hrdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://hr:${POSTGRES_PASSWORD:-hr_dev_password}@db:5432/hrdb
      # RAG runs inside Postgres via pgvector (VECTOR_BACKEND=auto). No Qdrant.
      ENVIRONMENT: production
      LLM_PROVIDER: ${LLM_PROVIDER:-fireworks}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-}
      FIREWORKS_CONTROL_BASE_URL: ${FIREWORKS_CONTROL_BASE_URL:-}
      FIREWORKS_ACCOUNT_ID: ${FIREWORKS_ACCOUNT_ID:-}
      FIREWORKS_VISION_MODEL: ${FIREWORKS_VISION_MODEL:-}
      ENABLE_RESUME_VLM: ${ENABLE_RESUME_VLM:-false}
      RESUME_VLM_MAX_PAGES: ${RESUME_VLM_MAX_PAGES:-10}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-}
      FIREWORKS_MAX_RETRIES: ${FIREWORKS_MAX_RETRIES:-4}
      FIREWORKS_SESSION_AFFINITY: ${FIREWORKS_SESSION_AFFINITY:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET for production}
      AUTH_ENFORCE: "true"
      AUTH_OPEN_REGISTRATION: ${AUTH_OPEN_REGISTRATION:-false}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:3000}"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000/ws/feed}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
