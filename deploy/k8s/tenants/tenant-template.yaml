apiVersion: v1
kind: Namespace
metadata:
  name: replace-tenant
  labels:
    hrcc.tenant: replace-tenant
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: replace-tenant
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 96Gi
    limits.cpu: "32"
    limits.memory: 192Gi
    requests.amd.com/gpu: "1"
    pods: "12"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-default-deny
  namespace: replace-tenant
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-operator
  namespace: replace-tenant
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources: ["pods", "pods/log", "services", "deployments", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-operator
  namespace: replace-tenant
subjects:
  - kind: Group
    name: replace-tenant-operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: tenant-operator
  apiGroup: rbac.authorization.k8s.io
