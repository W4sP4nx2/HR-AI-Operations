apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hr-ai-system
resources:
  - ../../base
  - model-download-egress.yaml
  - backend-database-egress.yaml
patches:
  - path: patch-configmap.yaml
  - path: patch-gpu-inference.yaml
  - path: patch-model-cache.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: hr-ai-command-center
      hackathon.hrcc.ai/track: best-amd-hosted-gemma
    includeSelectors: true
    includeTemplates: true
commonAnnotations:
  hackathon.hrcc.ai/win-point: "AMD-hosted Gemma via ROCm vLLM"
  hackathon.hrcc.ai/auth-profile: "AMD vLLM service auth is backend-only; Fireworks BYOK is a separate profile"
