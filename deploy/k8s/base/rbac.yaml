apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrcc-backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrcc-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrcc-gpu-inference
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrcc-operator-readonly
rules:
  - apiGroups: ["", "apps", "autoscaling", "policy"]
    resources: ["pods", "pods/log", "services", "deployments", "replicasets", "horizontalpodautoscalers", "poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrcc-operator-readonly
subjects:
  - kind: Group
    name: hr-ai-operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: hrcc-operator-readonly
  apiGroup: rbac.authorization.k8s.io
