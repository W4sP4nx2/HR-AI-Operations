apiVersion: v1
kind: ConfigMap
metadata:
  name: hrcc-config
data:
  ENVIRONMENT: production
  AUTH_ENFORCE: "true"
  AUTH_OPEN_REGISTRATION: "false"
  LLM_PROVIDER: amd_vllm
  AMD_VLLM_BASE_URL: http://hrcc-gpu-inference:8000/v1
  VECTOR_BACKEND: pgvector
  ENABLE_RAG: "true"
  RATE_LIMIT_REQUESTS: "500"
  RATE_LIMIT_WINDOW_SECONDS: "3600"
  REDACT_PII: "true"
  PII_ENGINE: regex
  FRONTEND_BASE: https://hr.example.invalid
  CORS_ORIGINS: '["https://hr.example.invalid"]'
