services:
  db:
    # Postgres 16 with the pgvector extension — one datastore for app data + RAG
    # (no separate Qdrant service). For zero-setup local dev without Docker, the
    # backend also runs on SQLite (RAG degrades gracefully).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr_dev_password
      POSTGRES_DB: hrdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hrdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hr:hr_dev_password@db:5432/hrdb
      - ENVIRONMENT=development
      - LLM_PROVIDER=${LLM_PROVIDER:-fireworks}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_BASE_URL=${FIREWORKS_BASE_URL:-}
      - FIREWORKS_CONTROL_BASE_URL=${FIREWORKS_CONTROL_BASE_URL:-}
      - FIREWORKS_ACCOUNT_ID=${FIREWORKS_ACCOUNT_ID:-}
      - FIREWORKS_VISION_MODEL=${FIREWORKS_VISION_MODEL:-}
      - ENABLE_RESUME_VLM=${ENABLE_RESUME_VLM:-false}
      - RESUME_VLM_MAX_PAGES=${RESUME_VLM_MAX_PAGES:-10}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/feed
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
