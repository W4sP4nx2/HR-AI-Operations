name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Python + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint tools
        run: pip install ruff black

      - name: Ruff
        run: ruff check backend

      - name: Black (check)
        run: black --check backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build (type-check + bundle)
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v

  compliance:
    name: Compliance gate (bias + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bias / fairness gate (disparity ratio < 1.1)
        working-directory: backend
        run: pytest tests/compliance -v
      - name: Security + compliance behaviour gate
        working-directory: backend
        run: pytest tests/test_security.py tests/test_compliance.py -v

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, test, compliance]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --platform linux/amd64 -t hr-command-center-backend ./backend

      - name: Build frontend image
        run: docker build --platform linux/amd64 -t hr-command-center-frontend ./frontend
